name: deep-triangular-halogen-motif-study

on:
  push:
    branches:
      - analysis-triangular-motif-test
    paths:
      - 'triangular_halogen_motif_discovery/*.py'
      - 'triangular_halogen_motif_discovery/README.md'
      - '.github/workflows/deep-triangular-halogen-motif.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: triangular-halogen-motif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis-triangular-motif-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pymatgen ase dscribe tabulate matplotlib
      - name: Extract CIF archive
        run: |
          rm -rf data_cifs
          mkdir -p data_cifs
          tar -xzf MP_1702_cif_files.tar.gz -C data_cifs
          echo "CIF count: $(find data_cifs -name '*.cif' | wc -l)"
      - name: Run formula-clean final analysis
        run: |
          rm -rf triangular_halogen_motif_discovery/results_formula_clean
          python triangular_halogen_motif_discovery/formula_clean_final.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean
      - name: Run full-MX REMatch validation
        run: |
          python triangular_halogen_motif_discovery/rematch_validation.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean
      - name: Run formal small-sample statistical validation
        run: |
          python triangular_halogen_motif_discovery/statistical_validation.py \
            --results-dir triangular_halogen_motif_discovery/results_formula_clean
      - name: Run local LOPO, formula-balanced ranking, and 1000-run empirical null
        run: |
          python triangular_halogen_motif_discovery/local_motif_validation.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean \
            --n-perm 1000
      - name: Run positive-only facility-location multi-prototype validation
        run: |
          python triangular_halogen_motif_discovery/multiprototype_validation.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean
      - name: Run leave-two-positive-out robustness audit
        run: |
          python triangular_halogen_motif_discovery/leave_two_out_validation.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean
      - name: Export selected prototypes as .vasp structures
        run: |
          python triangular_halogen_motif_discovery/export_prototype_structures.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --results-dir triangular_halogen_motif_discovery/results_formula_clean
      - name: Generate paper-facing synthesis and figures
        run: |
          python triangular_halogen_motif_discovery/research_synthesis.py \
            --results-dir triangular_halogen_motif_discovery/results_formula_clean
      - name: Print paper-facing results
        run: |
          cat triangular_halogen_motif_discovery/results_formula_clean/FINAL_RESULTS.md
          cat triangular_halogen_motif_discovery/results_formula_clean/STATISTICAL_VALIDATION.md
          cat triangular_halogen_motif_discovery/results_formula_clean/LOCAL_MOTIF_VALIDATION.md
          cat triangular_halogen_motif_discovery/results_formula_clean/MULTIPROTOTYPE_VALIDATION.md
          cat triangular_halogen_motif_discovery/results_formula_clean/LEAVE_TWO_OUT_VALIDATION.md
          cat triangular_halogen_motif_discovery/results_formula_clean/RESEARCH_CONCLUSIONS.md
      - name: Commit complete reproducible results to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add triangular_halogen_motif_discovery/results_formula_clean
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Freeze static-structure motif validation suite [skip ci]'
            git push origin HEAD:analysis-triangular-motif-test
          fi
      - name: Upload complete result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-clean-triangular-halogen-motif-results
          path: triangular_halogen_motif_discovery/results_formula_clean
