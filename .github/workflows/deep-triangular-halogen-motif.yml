name: deep-triangular-halogen-motif-study

on:
  push:
    branches:
      - analysis-triangular-motif-test
    paths:
      - 'triangular_halogen_motif_discovery/**'
      - '.github/workflows/deep-triangular-halogen-motif.yml'
  workflow_dispatch:

jobs:
  deep-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn pymatgen ase dscribe tabulate
      - name: Extract CIF archive
        run: |
          rm -rf data_cifs
          mkdir -p data_cifs
          tar -xzf MP_1702_cif_files.tar.gz -C data_cifs
          echo "CIF count: $(find data_cifs -name '*.cif' | wc -l)"
      - name: Run preliminary deep study audit trail
        run: |
          rm -rf triangular_halogen_motif_discovery/results
          python triangular_halogen_motif_discovery/deep_study.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results
      - name: Run preliminary post-hoc validation audit trail
        run: |
          python triangular_halogen_motif_discovery/posthoc_validation.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results
      - name: Run formula-clean final analysis
        run: |
          rm -rf triangular_halogen_motif_discovery/results_formula_clean
          python triangular_halogen_motif_discovery/formula_clean_final.py \
            --cif-root data_cifs \
            --metadata 'mp_database/MP_1702_实验记录与结构去重表.csv' \
            --outdir triangular_halogen_motif_discovery/results_formula_clean
      - name: Print paper-facing formula-clean results
        if: always()
        run: |
          if [ -f triangular_halogen_motif_discovery/results_formula_clean/FINAL_RESULTS.md ]; then
            cat triangular_halogen_motif_discovery/results_formula_clean/FINAL_RESULTS.md
          fi
      - name: Upload all study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-triangular-halogen-motif-results
          path: |
            triangular_halogen_motif_discovery/results
            triangular_halogen_motif_discovery/results_formula_clean
